
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Aeropuerto</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .botones {
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0056b3;
    }

    .seccion {
      display: none;
      margin: 20px auto;
      width: 80%;
      background: white;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto; 
    }

    .tabla-contenedor {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 700px; 
      margin-top: 10px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      white-space: nowrap; 
    }

    th {
      background: #007BFF;
      color: white;
    }

    textarea {
      width: 90%;
      margin: 10px 0;
      padding: 10px;
      font-family: Consolas, monospace;
      resize: vertical;
    }
  </style>
</head>
<body>

<h1>✈️ Sistema de Aeropuerto</h1>

<div class="botones">
  <button onclick="modoAdmin()">Admin</button>
  <button onclick="modoEmpleado()">Empleado</button>
  <button onclick="modoPublico()">Público</button>
</div>

<div id="vuelos" class="seccion">
  <h2>Vuelos del día</h2>
  <div class="tabla-contenedor">
    <table id="tablaVuelos"></table>
  </div>
</div>

<div id="pasajeros" class="seccion">
  <h2>Pasajeros frecuentes</h2>
  <div class="tabla-contenedor">
    <table id="tablaPasajeros"></table>
  </div>
</div>

<div id="mantenimiento" class="seccion">
  <h2>Aeronaves en mantenimiento</h2>
  <div class="tabla-contenedor">
    <table id="tablaMantenimiento"></table>
  </div>
</div>

<div id="tripulacion" class="seccion">
  <h2>Asignación de tripulación</h2>

  <label>Fecha del vuelo</label>
  <br>
  <input type="datetime-local" id="fechaVuelo">
  <br><br>

  <label>Ruta ID</label>
  <br>
  <input type="number" id="rutaId">
  <br><br>

  <button onclick="asignarTripulacion()">Ejecutar</button>
</div>

<div id="checkin" class="seccion">
  <h2>Check-in automático</h2>

  <label>Vuelo ID</label>
  <br>
  <input type="number" id="vueloId">
  <br><br>

  <button onclick="hacerCheckin()">Ejecutar</button>
</div>

<div id="estadisticas" class="seccion">
  <h2>Estadísticas de puntualidad</h2>
  <button onclick="verEstadisticas()">Ver</button>
  <pre id="resultadoEstadisticas"></pre>
</div>

<script src="index.js"></script>

</body>
</html>
